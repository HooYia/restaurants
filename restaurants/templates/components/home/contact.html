<!-- CONTACT -->
<section id="contact" style="padding-top:20px;">
  <div class="container contact-grid">
    <div class="contact-info reveal">
      <h3>Nous trouver</h3>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <div><strong>Adresse</strong><span>Quartier Centre-ville, Bafoussam, Cameroun</span></div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .6 3a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.5c1 .3 2 .5 3 .6a2 2 0 011.7 2z"/></svg>
        <div><strong>Téléphone</strong><span>+237 6XX XX XX XX</span></div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <div><strong>Horaires</strong><span>Tous les jours · 10h – 22h</span></div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <div><strong>Email</strong><span>contact@lesdelicesdemams.cm</span></div>
      </div>
      <div class="socials">
        <a href="#" aria-label="Facebook"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 22v-9h3l1-4h-4V6.5C13 5.3 13.4 4.5 15.1 4.5H17V1.1C16.6 1 15.4 0.9 14 0.9c-2.9 0-4.9 1.8-4.9 5V9H6v4h3.1v9H13z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
        <a href="#" aria-label="WhatsApp"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-1.3-.6-2.2-1.1-3.1-2.6-.2-.4.2-.4.6-1.2.1-.2 0-.4 0-.5-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.2.2-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg></a>
      </div>
    </div>

    <form class="reserve reveal" id="reserve-form">
      <h3 style="font-family:var(--font-script);color:var(--maroon);font-size:2rem;margin-bottom:1.6rem;">Réserver une table</h3>
      <div class="form-row">
        <div class="field">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required>
        </div>
        <div class="field">
          <label for="phone">Téléphone</label>
          <input type="tel" id="phone" name="phone" placeholder="+237 6XX XX XX XX" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="field">
          <label for="guests">Nombre de personnes</label>
          <select id="guests" name="guests">
            <option>1 personne</option>
            <option selected>2 personnes</option>
            <option>3–4 personnes</option>
            <option>5+ personnes</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="message">Message (optionnel)</label>
        <textarea id="message" name="message" placeholder="Une allergie, une occasion spéciale..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Confirmer la réservation</button>
      <p class="form-note">Nous vous confirmons votre table par téléphone sous 1h.</p>
    </form>
  </div>
</section>

<div class="wax-divider"></div>

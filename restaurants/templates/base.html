<script src="{% static 'js/toast_manager.js' %}"></script>
{% if messages %}
<script>
    {% for message in messages %}
        setTimeout(() => {
            console.log("Showing toast:", "{{ message|escapejs }}", "Tags:", "{{ message.tags }}");
            toastManager.create()
                .setMessage("{{ message|escapejs }}")
                .setType("{% if 'error' in message.tags %}error{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %}")
                .show();
        }, 100);
    {% endfor %}
</script>
{% endif %}

<script>
  // Header shadow on scroll
  const header = document.getElementById('site-header');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 10);
  });

  // Mobile menu (Drawer)
  const burger = document.getElementById('burger');
  const nav = document.getElementById('main-nav');
  const overlay = document.getElementById('menu-overlay');

  function toggleMenu() {
    const isOpen = nav.classList.toggle('open');
    burger.classList.toggle('active');
    overlay.classList.toggle('open');
    burger.setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }

  burger.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);

  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    if(nav.classList.contains('open')) toggleMenu();
  }));

  // Reveal on scroll
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));

  // Reservation form
  document.getElementById('reserve-form').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const original = btn.textContent;
    btn.innerHTML = '<span style="display:inline-block; width:16px; height:16px; border:2px solid #fff; border-bottom-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin-right:8px; vertical-align:middle;"></span> Envoi...';
    
    // Simulate API call
    setTimeout(() => {
      btn.textContent = 'Demande envoyée ✓';
      btn.style.background = 'var(--green)';
      setTimeout(() => { 
        btn.textContent = original; 
        btn.style.background = ''; 
        this.reset();
      }, 3000);
    }, 800);
  });
</script>
</body>
</body>

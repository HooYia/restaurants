<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fbf5e9;
            color: #231610;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #6b2a1f; /* Maroon */
            padding: 30px 20px;
            text-align: center;
        }
        .header img {
            max-height: 70px;
            border-radius: 50%;
            border: 2px solid #e0a85c; /* Amber */
        }
        .header h1 {
            color: #efe0c4; /* Cream */
            margin: 15px 0 0 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 30px;
            color: #4a3b32;
        }
        .content h2 {
            color: #c97a3a; /* Terracotta */
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            background-color: #e0a85c;
            color: #231610 !important;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 999px;
            font-weight: bold;
            margin-top: 20px;
        }
        .footer {
            background-color: #2f1c13;
            color: #efe0c4;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }
        .footer a {
            color: #e0a85c;
            text-decoration: none;
        }
        .order-summary {
            background-color: #f9fafb;
            border: 1px solid #e0a85c33;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .order-summary table {
            width: 100%;
            border-collapse: collapse;
        }
        .order-summary th, .order-summary td {
            padding: 10px;
            border-bottom: 1px solid #e0a85c33;
            text-align: left;
        }
        .order-summary th {
            color: #6b2a1f;
        }
        .total-row td {
            font-weight: bold;
            color: #c97a3a;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            {% if logo_url %}
                <img src="{{ logo_url }}" alt="{{ site_name }} Logo">
            {% endif %}
            <h1>{{ site_name }}</h1>
        </div>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        
        <div class="footer">
            <p>&copy; {% now "Y" %} {{ site_name }}. Tous droits réservés.</p>
            <p>Ce message a été envoyé automatiquement, merci de ne pas y répondre.</p>
        </div>
    </div>
</body>
</html>

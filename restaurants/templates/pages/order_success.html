{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
  .success-page { padding: 6rem 0; background: var(--paper); min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .success-card { background: #fff; border: 1px solid rgba(107,42,31,.08); border-radius: var(--radius); padding: 3rem; text-align: center; max-width: 600px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .success-icon { width: 80px; height: 80px; background: var(--green, #27ae60); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .success-icon svg { width: 40px; height: 40px; }
  .success-title { font-family: var(--font-brush); color: var(--maroon); font-size: 2.5rem; margin-bottom: 1rem; }
  .success-text { color: #8a7660; font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; }
  .order-ref { font-weight: 700; color: var(--dark); background: rgba(201,122,58,.1); padding: 0.5rem 1rem; border-radius: 6px; display: inline-block; margin-bottom: 2rem; letter-spacing: 1px; }
  .btn-primary { background: var(--terracotta); color: #fff; padding: 1rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 700; display: inline-block; transition: transform 0.2s; }
  .btn-primary:hover { transform: translateY(-2px); }
</style>

<div class="success-page">
  <div class="container">
    <div class="success-card reveal">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1 class="success-title">Commande confirmée !</h1>
      <p class="success-text">
        Merci pour votre commande. Notre équipe la prépare avec amour et elle vous sera livrée très prochainement à l'adresse indiquée.
      </p>
      
      <div>
        <span class="order-ref">RÉFÉRENCE : #{{ order.id|truncatechars:10 }}</span>
      </div>
      
      <a href="{% url 'users:client-dashboard' %}" class="btn-primary">Suivre ma commande</a>
    </div>
  </div>
</div>
{% endblock %}

{% load static %}
<aside class="sidebar">
<div class="sidebar-brand">
    <a href="{% url 'users:home' %}" target="_blank" rel="noopener noreferrer">

        <img
            src="{% if company_setting and company_setting.logo %}{{ company_setting.logo.url }}{% else %}{% static 'images/logo-mams.png' %}{% endif %}"
            alt="{{ company_setting.restaurant_name|default:'Mam''s' }}"
        >

        <span>
            {{ company_setting.restaurant_name|default:"Mam's" }}
        </span>

    </a>
</div>

  <nav class="nav-group">
    <p class="nav-label">Mon espace</p>
    <a href="{% url 'users:client-dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'client-dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Tableau de bord
    </a>
    <a href="{% url 'users:order-list' %}" class="nav-link {% if 'commandes' in request.path or 'orders' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l1.5 4M18 2l-1.5 4M4 6h16l-1.5 12a2 2 0 01-2 1.8H7.5a2 2 0 01-2-1.8L4 6z"/></svg>
      Mes Commandes
    </a>
    <a href="#" class="nav-link {% if 'reservations' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      Mes Réservations
    </a>
  </nav>

  <nav class="nav-group">
    <p class="nav-label">Paramètres</p>
    <a href="{% url 'users:profile-update' %}" class="nav-link {% if 'profil' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Mon Profil
    </a>
    <a href="{% url 'users:testimonial-create' %}" class="nav-link {% if 'avis' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      Donner mon avis
    </a>
    <a href="{% url 'users:address-list' %}" class="nav-link {% if 'adresses' in request.path or 'addresses' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      Mes Adresses
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'users:home' %}" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Accueil du site
    </a>
    <a href="{% url 'users:client-messages' %}" class="nav-link {% if 'messages' in request.path %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Support / Messages
    </a>
    <a href="{% url 'users:logout' %}" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Déconnexion
    </a>
  </div>
</aside>
